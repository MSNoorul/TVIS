backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads/projects"
public_folder: "/uploads/projects"

collections:
  - name: "company_profile"
    label: "Company Profile"
    files:
      - file: "src/data/companyProfile.json"
        label: "TVIS Overview PDF"
        name: "companyProfile"
        fields:
          - label: "PDF File"
            name: "pdf"
            widget: "file"
            media_folder: "public/uploads/documents"
            public_folder: "/uploads/documents"
            hint: "Upload the TVIS Overview PDF shown on the About page download button."
  - name: "projects"
    label: "Projects"
    files:
      - file: "src/data/projects.json"
        label: "Completed Projects"
        name: "projects"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}} — {{fields.category}}"
            fields:
              - { label: "Image", name: "img", widget: "image" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Year", name: "year", widget: "string" }
              - label: "Scope"
                name: "scope"
                widget: "list"
                label_singular: "Scope item"
  - name: "brands"
    label: "Brands"
    files:
      - file: "src/data/brands.json"
        label: "Partner Brands"
        name: "brands"
        fields:
          - label: "Brands"
            name: "brands"
            widget: "list"
            summary: "{{fields.name}} — {{fields.category}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["pumps", "electrical", "mechanical"]
              - label: "Logo"
                name: "logo"
                widget: "image"
                media_folder: "public/uploads/brands"
                public_folder: "/uploads/brands"
      - file: "src/data/featuredBrands.json"
        label: "Featured Brands"
        name: "featuredBrands"
        fields:
          - label: "Featured Brands"
            name: "featuredBrands"
            widget: "list"
            summary: "{{fields.name}} — {{fields.category}}"
            hint: "Spotlight brands shown at the top of the Brands page. If a brand is featured here, it's automatically hidden from the full grid below to avoid duplicates."
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["pumps", "electrical", "mechanical"]
              - label: "Logo"
                name: "logo"
                widget: "image"
                media_folder: "public/uploads/brands/featured"
                public_folder: "/uploads/brands/featured"
  - name: "about"
    label: "About Page"
    files:
      - file: "src/data/about.json"
        label: "About Content"
        name: "about"
        fields:
          - label: "Intro (English)"
            name: "intro_en"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
              - { label: "Button text", name: "cta", widget: "string" }
          - label: "Intro (Arabic)"
            name: "intro_ar"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
              - { label: "Button text", name: "cta", widget: "string" }
          - label: "Pillars (Why We're Your Best Choice)"
            name: "pillars"
            widget: "list"
            summary: "{{fields.title_en}}"
            fields:
              - label: "Icon"
                name: "icon"
                widget: "select"
                options: ["award", "users", "eye", "target"]
              - { label: "Title (English)", name: "title_en", widget: "string" }
              - { label: "Body (English)", name: "body_en", widget: "text" }
              - { label: "Title (Arabic)", name: "title_ar", widget: "string" }
              - { label: "Body (Arabic)", name: "body_ar", widget: "text" }
